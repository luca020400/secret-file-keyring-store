[package]
authors = ["Luca Stefani <luca.stefani.ge1@gmail.com>", "Daniel Brotsky <dev@brotsky.com>"]
description = "Secret-encrypted file credential store for keyring"
homepage = "https://github.com/open-source-cooperative/keyring-rs/wiki/Keyring"
keywords = ["encryption", "credential-store", "keyring"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-source-cooperative/secret-file-keyring-store.git"
rust-version = "1.88"
exclude = [".github/"]
readme = "README.md"
name = "secret-file-keyring-store"
version = "1.0.0"
edition = "2024"

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3", features = ["base64"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
rand = "0.10"
keyring-core = "1"

[dev-dependencies]
fastrand = "2"
regex = "1"
sscanf = "0.5"

[lints.rust]
unreachable_pub = "warn"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
