[package]
authors = ["Luca Stefani <luca.stefani.ge1@gmail.com>", "Daniel Brotsky <dev@brotsky.com>"]
description = "Secret portal file credential store for keyring"
homepage = "https://github.com/open-source-cooperative/keyring-rs/wiki/Keyring"
keywords = ["zbus", "portal", "credential-store", "keyring"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/open-source-cooperative/zbus-secret-portal-keyring-store.git"
rust-version = "1.88"
exclude = [".github/"]
readme = "README.md"
name = "zbus-secret-portal-keyring-store"
version = "1.0.1"
edition = "2024"

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
rand = "0.10"
keyring-core = "1"
zbus = "5"

[dev-dependencies]
fastrand = "2"
regex = "1"
sscanf = "0.5"

[lints.rust]
unreachable_pub = "warn"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
